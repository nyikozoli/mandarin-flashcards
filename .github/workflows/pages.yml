# Builds the app and publishes dist/site to GitHub Pages (https://nyikozoli.github.io/mandarin-flashcards/).
# Changes that cannot affect the site (docs, Markdown, Supabase migrations) skip the run.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the word data
        run: npm run check
      - name: Build and verify
        run: npm run build
      # The in-app self-check (every feature, plus sync against a simulated server) in headless Chrome,
      # for the offline file and for the site build.
      - name: Self-check
        run: |
          npm run selfcheck
          npm run selfcheck -- dist/site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
